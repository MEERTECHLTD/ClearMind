name: Web e2e

# Production-bundle Playwright suite for the web app (navigation after deploys,
# service worker, headers, PWA install). See docs/WEB_CACHING_AND_PWA.md.
on:
  pull_request:
    paths-ignore:
      - 'apps/mobile/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/web/playwright-report
