name: Android Release (Gradle, no EAS)

# Auth-free Android release: `expo prebuild` + Gradle on the runner, signed with
# the secret-stored upload keystore. No EAS login / EXPO_TOKEN needed. Builds the
# in-place project, so Metro resolves @clearmind/shared via metro.config
# watchFolders (avoids the eas-build --local monorepo-tarball caveat).
#
# On a `mobile-v*` tag it ALSO publishes a GitHub Release with the .apk + .aab
# attached (permanent public download URLs). On manual dispatch it just uploads
# workflow artifacts.

on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']

concurrency:
  group: android-gradle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create the GitHub Release on tag

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Inlined into the JS bundle by Metro during the gradle bundle task:
      EXPO_PUBLIC_FIREBASE_API_KEY:             ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN:         ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID:          ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET:      ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID:              ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GEMINI_API_KEY:               ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      # OAuth Web client id for @react-native-google-signin (GoogleSignin.configure):
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:         ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # app.config.ts reads this for android.versionCode (must rise per build):
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: '1'
      # expo-router's _ctx require.context needs EXPO_ROUTER_IMPORT_MODE inlined too
      # (babel.config.js include list); 'sync' = eager routes.
      EXPO_ROUTER_IMPORT_MODE: sync
      # EXPO_ROUTER_APP_ROOT is intentionally NOT set here. It must be a path
      # RELATIVE to expo-router's _ctx file (node_modules/expo-router), NOT an
      # absolute runner path: an absolute value compiles but makes require.context
      # enumerate ZERO routes (silent "No routes found" / config-less app). It is
      # computed hoisting-proof in the "Compute EXPO_ROUTER_APP_ROOT" step below.

    steps:
      - uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KB64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          miss=()
          [ -z "$KB64" ] && miss+=(ANDROID_KEYSTORE_BASE64)
          [ -z "$SP" ]   && miss+=(ANDROID_KEYSTORE_PASSWORD)
          [ -z "$KP" ]   && miss+=(ANDROID_KEY_PASSWORD)
          if [ ${#miss[@]} -ne 0 ]; then
            echo "::error::Missing signing secrets: ${miss[*]}"; exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install workspace dependencies (repo root)
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Align Expo native deps to the SDK
        working-directory: apps/mobile
        run: npx expo install --fix

      # EXPO_ROUTER_APP_ROOT must be RELATIVE to expo-router's _ctx file (where the
      # require.context lives) so it resolves the same regardless of the bundling
      # step's cwd, AND so require.context actually enumerates files (an absolute
      # path silently enumerates nothing -> "No routes found", the real v0.0.11
      # crash). Compute it from expo-router's real (hoisted) location so it survives
      # node_modules layout changes. Run AFTER `expo install --fix` so a re-hoist of
      # expo-router can't leave the value stale. babel.config.js inlines this into
      # _ctx via transform-inline-environment-variables.
      - name: Compute EXPO_ROUTER_APP_ROOT (relative, hoisting-proof)
        run: |
          REL=$(node -e "const p=require('path');const er=p.dirname(require.resolve('expo-router/package.json'));console.log(p.relative(er,p.resolve('apps/mobile/app')))")
          if [ -z "$REL" ] || [ ! -d "apps/mobile/app" ]; then echo "::error::could not compute EXPO_ROUTER_APP_ROOT (got '$REL')"; exit 1; fi
          echo "EXPO_ROUTER_APP_ROOT=$REL" >> "$GITHUB_ENV"
          echo "Computed EXPO_ROUTER_APP_ROOT=$REL"

      # app.config.ts references android.googleServicesFile, and the google-signin
      # plugin reads it during prebuild — so decode it from the secret first.
      - name: Decode google-services.json (Firebase Android config)
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::GOOGLE_SERVICES_JSON secret missing"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          node -e "require('./google-services.json'); console.log('google-services.json OK')"

      - name: Prebuild Android (generate android/)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Inject release signing (keystore + build.gradle patch)
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # Signing props are passed on the gradle command line (-P) below, NOT via
          # gradle.properties (Expo's file may lack a trailing newline, merging the
          # first appended line and hiding the property -> "missing storeFile").
          node scripts/patch-android-signing.mjs
          test -s android/app/upload-keystore.jks && echo "keystore decoded ($(wc -c < android/app/upload-keystore.jks) bytes)"

      - name: Debug resolved babel/reanimated versions
        working-directory: apps/mobile
        run: |
          node -e "console.log('babel-preset-expo:', require('babel-preset-expo/package.json').version)" || echo "bpe resolve FAILED"
          node -e "console.log('react-native-reanimated:', require('react-native-reanimated/package.json').version)" || true
          node -e "try{require.resolve('react-native-worklets/plugin');console.log('worklets/plugin: PRESENT')}catch(e){console.log('worklets/plugin: absent (expected for SDK53)')}"
          # ASSERT babel-preset-expo can resolve expo-router from its own location.
          # If not (monorepo hoisting split them), its expo-router plugin silently
          # skips _ctx -> "No routes found" crash at launch. Fail the build instead.
          node -e "const path=require('path');const d=path.dirname(require.resolve('babel-preset-expo/package.json'));require.resolve('expo-router/package.json',{paths:[d]});console.log('expo-router resolvable from babel-preset-expo: OK (router plugin will run)')"

      # Device-free guardrail (fail BEFORE building/publishing). Produce the PLAIN
      # JS bundle that gradle would feed to Hermes and assert the two things that
      # silently broke past releases: (1) Firebase config is embedded (projectId),
      # (2) expo-router enumerated the app routes (a unique app/index.tsx literal).
      # Empty config = v0.0.11 launch crash; zero routes = absolute-app-root regression.
      - name: Verify JS bundle (Firebase config embedded + routes enumerated)
        working-directory: apps/mobile
        run: |
          npx expo export:embed --platform android --dev false --reset-cache \
            --bundle-output /tmp/verify.bundle --assets-dest /tmp/verify-assets
          ok=1
          grep -q "clearmind-b8d2b" /tmp/verify.bundle || { echo "::error::Firebase config NOT embedded (projectId 'clearmind-b8d2b' missing from bundle)"; ok=0; }
          grep -q "SHA-1 not registered" /tmp/verify.bundle || { echo "::error::app routes NOT enumerated (app/index.tsx missing — check EXPO_ROUTER_APP_ROOT is relative)"; ok=0; }
          if [ "$ok" = 1 ]; then echo "Bundle OK: Firebase config embedded AND routes enumerated"; else exit 1; fi

      # APK is the directly-installable artifact and signs via apksigner (robust).
      # Signing props passed with -P (GitHub masks the secret values in logs).
      - name: Build APK (release, signed)
        working-directory: apps/mobile/android
        env:
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PCLEARMIND_UPLOAD_STORE_FILE=upload-keystore.jks \
            -PCLEARMIND_UPLOAD_KEY_ALIAS="${ALIAS:-clearmind-upload}" \
            -PCLEARMIND_UPLOAD_STORE_PASSWORD="$SP" \
            -PCLEARMIND_UPLOAD_KEY_PASSWORD="$KP"

      # AAB (Play Store) signs via bundletool's FinalizeBundleTask — best-effort so
      # it never blocks the APK release.
      - name: Build AAB (Play Store, best-effort)
        continue-on-error: true
        working-directory: apps/mobile/android
        env:
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -PCLEARMIND_UPLOAD_STORE_FILE=upload-keystore.jks \
            -PCLEARMIND_UPLOAD_KEY_ALIAS="${ALIAS:-clearmind-upload}" \
            -PCLEARMIND_UPLOAD_STORE_PASSWORD="$SP" \
            -PCLEARMIND_UPLOAD_KEY_PASSWORD="$KP"

      - name: Collect artifacts (APK required, AAB optional)
        working-directory: apps/mobile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::error::no signed APK was produced"; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/out/clearmind-${{ github.run_number }}.apk"
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1)
          if [ -n "$AAB" ]; then cp "$AAB" "$GITHUB_WORKSPACE/out/clearmind-${{ github.run_number }}.aab"; echo "AAB included"; else echo "::warning::AAB not produced (bundletool signing) — APK only"; fi
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Verify APK signature (apksigner)
        continue-on-error: true
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "using: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/out/clearmind-${{ github.run_number }}.apk" || true

      - uses: actions/upload-artifact@v4
        with:
          name: clearmind-android-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attach whatever was produced (APK always; AAB if bundletool succeeded).
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "ClearMind Mobile ${GITHUB_REF_NAME} (skeleton)" \
            --notes "Signed Android build (Gradle CI). Phase-2 skeleton: branded splash + placeholder home; full views land in Phases 3-9. APK = sideload install; AAB (if present) = Play Store." \
            --target "${GITHUB_SHA}"
