# ClearMind desktop packaging (electron-builder): macOS (direct + Mac App Store)
# and Windows. See docs/MACOS.md.
#
# appId is the iOS bundle id on purpose: the Mac App Store build joins the iOS
# app record (Universal Purchase, ASC app 6821241402).
appId: tech.meertech.clearmind
productName: ClearMind
copyright: Copyright © 2026 Meertech LTD (meertech.tech). Built and licensed by Meertech LTD.
directories:
  output: dist
  buildResources: build
# The shell has no runtime dependencies (the web app is pre-bundled by Vite), so
# keep the workspace's node_modules (firebase-admin, expo, …) out of app.asar.
files:
  - src/**
  - package.json
  - native/build/*.node
  - "!**/node_modules/**"
asarUnpack:
  - native/build/*.node
# The web build (vite) ships next to the app code, served in-process by src/protocol.cjs.
extraResources:
  - from: build/web
    to: web
asar: true
npmRebuild: false
publish: null
# The system-browser sign-in returns here (src/authlink.cjs). Becomes
# CFBundleURLTypes on macOS (all targets, including the Mac App Store).
protocols:
  - name: ClearMind sign-in
    schemes:
      - clearmind-desktop

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip
  minimumSystemVersion: "12.0"
  darkModeSupport: true
  # The Sign in with Apple addon is already a fat (arm64 + x86_64) binary.
  x64ArchFiles: "**/apple_signin.node"
  # Hardened runtime is for Developer ID/notarized builds (pass
  # -c.mac.hardenedRuntime=true with a real identity); an ad-hoc signature with
  # it on fails library validation.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signature for local builds. Releases are Developer ID-signed and
  # notarized by scripts/release-mac.sh (npm run release:mac).
  identity: "-"
  # The zip keeps this name; the dmg overrides it below.
  artifactName: ${productName}-${version}-mac.${ext}
  extendInfo:
    LSApplicationCategoryType: public.app-category.productivity
    ITSAppUsesNonExemptEncryption: false

# Mac App Store: `npm run build:mas -w apps/desktop` (needs CLEARMIND_MAS_PROFILE).
mas:
  type: distribution
  identity: MEERTECH LTD (7N86K8Q433)
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mas.${ext}

# Development-signed sandboxed build to test App Store behaviour (incl. Sign in
# with Apple) on a registered Mac: `npm run build:mas-dev -w apps/desktop`.
masDev:
  type: development
  identity: Mahmud Sani (D5YR25S22A)
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  hardenedRuntime: false

dmg:
  artifactName: ${productName}.${ext}
  title: ${productName}
  contents:
    - { x: 130, y: 190 }
    - { x: 410, y: 190, type: link, path: /Applications }
  window: { width: 540, height: 380 }

# Windows: `npm run build:win -w apps/desktop` (unsigned: SmartScreen warns on first run).
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
  executableName: ClearMind
nsis:
  artifactName: ${productName}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClearMind
